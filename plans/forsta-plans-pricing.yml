metering_signal:
  note: >-
    Even without published tiers, consumption IS metered: every Decipher API response returns
    x-usage-today (calls and resource units consumed today) and a monthly usage report is
    available in the Portal. HTTP 402 is returned when a monthly call allowance is exceeded, which
    confirms that a contractual allowance exists per account.
  see: rate-limits/forsta-rate-limits.yml
