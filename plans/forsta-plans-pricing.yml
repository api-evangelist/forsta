method: searched
source: >-
  https://www.forsta.com/ (no pricing entry in the site navigation or the sitemap indexed by
  https://www.forsta.com/llms.txt), https://www.forsta.com/request-a-demo/ (the only commercial
  entry point, titled "Speak with an expert"), and
  https://legal.forsta.com/legal/api-access-schedule/
note: >-
  Replaces a 2026-05-04 bulk-sweep scaffold that invented a Free / Professional / Enterprise
  ladder with 1,000 and 100,000 monthly request quotas and 10/100 rpm limits (roadmap#35). None of
  that is published. Forsta is enterprise sales-led: /pricing, /plans and /get-started all return
  404, the 468-line llms.txt the site itself publishes names no pricing page, and the commercial
  path is a "Speak with an expert" contact form. API entitlement is governed by a contractual API
  Access Schedule that Forsta distributes as a PDF, not by a self-serve tier.
tags:
  - Customer Insights
  - Feedback
  - Market Research
description: >-
  Forsta publishes no plans, prices or included API quotas. Access to the Decipher REST API,
  Panel Management APIs and Sample Marketplace contracts is negotiated as part of an HX Platform
  subscription and governed by the API Access Schedule.
