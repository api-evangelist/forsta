specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Forsta
providerId: forsta
created: '2026-05-04'
modified: '2026-09-10'
generated: '2026-09-10'
method: searched
source: >-
  The "Accounting" and "Error States" sections of the Decipher REST API description at
  https://docs.developer.focusvision.com/docs/decipher/api, plus the 429 response declared in
  openapi/forsta-decipher-rest-api-openapi.yml
note: >-
  Replaces a 2026-05-04 bulk-sweep scaffold that asserted invented per-tier request-per-minute
  numbers (roadmap#35). Forsta publishes NO numeric rate limit. The provider states plainly:
  "Currently we do not set a limit on amount of calls or resource usage for each call. Future
  releases may have restrictions of number of monthly calls, burst calls and number of
  simultaneous calls." What it does publish is a per-response usage counter and two exhaustion
  status codes, recorded below.
tags:
  - Customer Insights
  - Feedback
  - Market Research
  - Rate Limiting
  - Quotas
description: >-
  Published rate-limit posture for the Forsta (Decipher) REST API. There is no documented numeric
  ceiling on calls or concurrency; consumption is metered and reported back on every response via
  the x-usage-today header, and a monthly usage report is available in the Portal. Exhaustion is
  signalled with HTTP 429 for concurrency and HTTP 402 for a monthly call allowance overrun.
limit_count: 0
limits: []
headers:
  usage: x-usage-today
  usage_format: '<calls today> <resource units today>'
  usage_example: 'x-usage-today: 26 2481'
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: >-
    No X-RateLimit-* or RFC 9239 RateLimit-* family, and no Retry-After. An agent that hits 429
    has no published backoff signal to read and must choose its own.
responseCodes:
  throttled: 429
  throttled_meaning: too many concurrent requests
  quotaExceeded: 402
  quotaExceeded_meaning: >-
    "payment required: you have exceeded your monthly API calls" - the monthly allowance is a
    contractual figure, not a published one; the API Access Schedule
    (https://legal.forsta.com/legal/api-access-schedule/) is distributed as a PDF.
scopes_metered:
  - scope: per-account per-day
    signal: x-usage-today header on every response
  - scope: per-account per-month
    signal: Portal "User Links" monthly usage report
  - scope: concurrency
    signal: HTTP 429
future:
  stated: >-
    The provider reserves the right to introduce limits on monthly calls, burst calls and
    simultaneous calls in future releases.
