aid: forsta
name: Forsta
description: 'Forsta is the customer experience and market research technology company formed from the
  2021 merger of Confirmit, FocusVision and Dapresy, and acquired by Press Ganey in 2022 to trade as PG
  Forsta. Its HX Platform spans survey data collection (Decipher / Forsta Surveys), panel and sample management,
  qualitative research, text and social analytics, and dashboard visualization for customer, employee
  and brand experience programs. Forsta publishes eight OpenAPI documents covering 345 operations at docs.developer.focusvision.com:
  the Decipher REST API for survey automation and data extraction, the Panel Management Integration, Community,
  webhook and vendor-callback contracts, and the Sample Marketplace partner contract that sample providers
  must implement to be listed.'
type: Index
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Commercial SaaS, per-tenant callable host
  confidence: medium
  source:
  - openapi
  - plans
  generated: '2026-09-10'
  method: derived
  note: Every published contract is callable over HTTPS, but the Decipher and Panel Management specs template
    the host as a {server} variable the customer substitutes with their own instance domain - there is
    no single shared public API host.
accessModel:
  pricing: enterprise
  onboarding: sales-assisted
  trial: false
  try_now: false
  public: false
  label: Enterprise, contact sales
  confidence: high
  source:
  - plans
  generated: '2026-09-10'
  method: searched
  note: Corrected 2026-09-10. The previous value (freemium) was derived from a 2026-05-04 bulk-sweep plans
    scaffold that invented a Free tier. Forsta publishes no pricing page - /pricing, /plans and /get-started
    all 404 and the site's own llms.txt names no pricing page; the only commercial entry point is a 'Speak
    with an expert' form. See plans/forsta-plans-pricing.yml.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/forsta.png
access: 3rd-Party
created: '2025-02-12'
modified: '2026-09-10'
position: Producing
tags:
- Customer Insights
- Feedback
- Market Research
- Surveys
- Customer Experience
- Employee Experience
- Panel Management
- Data Collection
- Analytics
- Voice of the Customer
