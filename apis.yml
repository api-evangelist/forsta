- aid: forsta:panel-management
  name: Forsta Panel Management APIs
  description: 'Panel Management exposes four published contracts: an Integration API (53 operations)
    for sessions, panelists, notes, projects and delivery statistics; a Community API (45 operations);
    a webhook payload contract for panelist, survey-activity and survey-invitation events signed with
    ECDSA in an X-KP-Webhook-Signature header; and a vendor-callback contract an incentives partner implements
    for authentication, user lookup, points redemption and refunds.'
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/forsta.png
