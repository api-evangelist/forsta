- aid: forsta:forsta
  name: Forsta Decipher REST API
  description: 'The Decipher REST API (Forsta Surveys) automates a private or shared Decipher instance:
    create and launch surveys, read datamaps, extract and edit response data, run crosstabs and dashboards,
    manage campaigns, panels, translations, quotas, archives, users and API keys. 226 operations over
    174 resource paths, authenticated with an x-apikey header.'
