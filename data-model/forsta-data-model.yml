entities:
  - name: company
    path: /rh/companies/{company}
    id: company slug or numeric id
    description: The tenant. Owns surveys, users, panels, preferences, retention settings and archives.
  - name: user
    path: /rh/users/{user}
    id: email address OR numeric user id (both accepted on the same route)
    description: A Research Hub user. Belongs to a company; can be impersonated by a staff key.
  - name: apikey
    path: /rh/apikeys/{apikey}
    id: the first 32 characters of the 64-character key
    description: >-
      An API credential belonging to a user, optionally restricted by call, method, forced
      parameter, IP network and expiry.
  - name: survey
    path: /surveys/{survey}
    id: path-shaped survey identifier, e.g. `demo/bapi20` or `your/survey`
    description: >-
      The central aggregate. Carries data, datamap, datasources, campaigns, tasks, files, sections,
      dashboards, crosstabs, quotas, videos, languages, parameters, subscribers and users.
  - name: panel
    path: /panels/{panel_id}
    id: numeric panel id
    description: A respondent panel. Referenced from both the Decipher API and Panel Management.
  - name: panelist
    path: /panels/{panelId}/panelists/{panelistHash}
    id: panelist hash
    description: An individual panel member in Panel Management, with notes and survey activity.
  - name: campaign
    path: /surveys/{survey}/campaigns/{campaign}
    id: campaign id
    description: An email invitation campaign attached to a survey, with lists, sends and suppressions.
  - name: datasource
    path: /surveys/{survey}/datasources/{datasource}
    id: datasource name
    description: External data attached to a survey, itself holding rows under /data.
  - name: task
    path: /surveys/{survey}/tasks/{task_id}
    id: task id
    description: A work item on a survey, with comments. Distinct from the async job at /status.
  - name: archive
    path: /archives/{company}
    id: company
    description: >-
      Archived survey storage and its deletion / retention reporting. deleteArchive purges
      collected data irreversibly.
