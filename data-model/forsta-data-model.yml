derivation_note: >-
  Derived from the URL hierarchy and path-parameter names, NOT from $ref graph. These contracts
  reuse almost no named schemas - 112 components.schemas exist across the eight documents but 89
  of the references point at one shared `error` schema and the Sample Marketplace qualification
