                          type: string
                          enum:
                          - mean
                          - median
                          - stddev
                          - se
                          - sum
                          - min
                          - max
                      transpose:
                        type: boolean
                        description: 'Sets defaults choice for transposing of question table.

                          '
                  numberMultiD:
                    type: object
                    description: 'Report defaults for two dimensional numeric question.

                      '
                    properties:
                      customBase:
                        type: string
                        description: Sets the default % Base.
                        enum:
                        - answering
                        - shown
                        - segment
                      expandable:
                        type: boolean
                        description: 'Sets the default choice for ''Nest Rows Under Nets''.

                          '
                      stats:
