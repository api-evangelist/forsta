                        type: boolean
                        description: 'Sets the default choice for ''Nest Rows Under Nets''.

                          '
                      stats:
                        type: array
                        description: Sets default stats.
                        items:
                          type: string
                          enum:
                          - mean
                          - median
                          - stddev
                          - se
                          - sum
                          - min
                          - max
                      transpose:
                        type: boolean
                        description: 'Sets defaults choice for transposing of question table.

                          '
                      questionTableChartType:
                        type: string
                        description: Sets default choice for chart type.
                        enum:
                        - bar
                        - column
                        - pie
                        - area
                        - line
                  ratingMultiD:
                    type: object
