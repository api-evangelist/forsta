                    properties:
                      customBase:
                        type: string
                        description: Sets the default % Base.
                        enum:
                        - answering
                        - shown
                        - segment
                        - responses
                      expandable:
                        type: boolean
                        description: 'Sets the default choice for ''Nest Rows Under Nets''

                          '
                      stats:
                        type: array
                        description: Sets default stats.
                        items:
                          type: string
                          enum:
                          - counts
                      summary:
                        type: array
                        description: Sets default summary tables.
                        items:
                          type: string
                          enum:
                          - counts
                      showGridTable:
                        type: boolean
                        description: Sets the default choice to display a grid table.
                      showAllTables:
                        type: boolean
                        description: Sets the default choice to display all tables.
                      transpose:
                        type: array
                        description: 'Sets defaults choice for transposing of grid, main and

                          stats summary tables.

                          '
                        items:
                          type: string
                          enum:
                          - gridTable
                          - rowTable
                          - counts
                      addRowSummaryTable:
                        type: boolean
                        description: 'Sets the default choice to add summary table or newly

                          added rows (nets).

                          '
                      chartTypeMapping:
                        type: object
                        description: 'Sets charts for grid, main or stat tables. See values of

                          transpose for object key and values of

                          `questionTableChartType` for value mapping.

                          '
                  numberOneD:
                    type: object
                    description: 'Report defaults for one dimensional numeric question.

                      '
                    properties:
                      customBase:
                        type: string
                        description: Sets the default % Base.
                        enum:
                        - answering
