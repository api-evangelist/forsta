openapi: 3.2.0
info:
  title: Decipher Rest Crosstabs API
  version: '1.0'
  description: The Decipher REST API allows comprehensive automation of your private or shared Decipher instance.
servers:
- url: https://{server}/api/v1
  description: Replace server with your instance domain.
  variables:
    server:
      default: selfserve.decipherinc.com
      description: Server domain
security:
- APIKey: []
tags:
- name: Crosstabs
paths:
  /rh/companies/{company}/crosstab-report-defaults:
    get:
      operationId: getRHCompanyCrosstabReportDefaults
      summary: Get crosstab preferences
      description: Retrieves company Crosstab Report Preference configuration file.
      tags:
      - Crosstabs
      parameters:
      - name: company
        description: company ID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  singleSelectOneD:
                    type: object
                    description: 'Report defaults for single select (radio/select) one

                      dimensional question.

                      '
                    properties:
                      customBase:
                        type: string
                        description: Sets the default % Base.
                        enum:
                        - answering
                        - shown
                        - segment
                      expandable:
                        type: boolean
                        description: 'Sets the default choice for ''Nest Rows Under Nets''.

                          '
                      stats:
                        type: array
                        description: Sets default stats.
                        items:
                          type: string
                          enum:
                          - mean
                          - median
                          - stddev
                          - se
                      transpose:
                        type: boolean
                        description: 'Sets default choice for transposing of question table.

                          '
                      questionTableChartType:
                        type: string
                        description: 'Sets defaults choice for chart type.

                          '
                        enum:
                        - bar
                        - column
                        - pie
                        - area
                        - line
                  singleSelectMultiD:
                    type: object
                    description: 'Report defaults for single select (radio/select)

                      multi-dimensional question.

                      '
                    properties:
                      customBase:
                        type: string
                        enum:
                        - answering
                        - shown
                        - segment
                        description: 'Sets the default % Base.

                          '
                      expandable:
                        type: boolean
                        description: 'Sets the default choice for ''Nest Rows Under Nets''

                          '
                      stats:
                        type: array
                        description: Sets default stats.
                        items:
                          type: string
                          enum:
                          - mean
                          - median
                          - stddev
                          - se
                          - sum
                          - min
                          - max
                      summary:
                        type: array
                        description: Sets default summary tables.
                        items:
                          type: string
                          enum:
                          - mean
                          - median
                          - stddev
                          - se
                          - sum
                          - min
                          - max
                      showGridTable:
                        type: boolean
                        description: Sets the default choice to display a grid table.
                      showAllTables:
                        type: boolean
                        description: Sets the default choice to display all tables.
                      transpose:
                        type: array
                        description: 'Sets defaults choice for transposing of grid, main and

                          stats summary tables.

                          '
                        items:
                          type: string
                          enum:
                          - gridTable
                          - rowTable
                          - mean
                          - median
                          - stddev
                          - se
                          - sum
                          - min
                          - max
                      addRowSummaryTable:
                        type: boolean
                        description: 'Sets the default choice to add a summary table for newly

                          added rows (nets).

                          '
                      chartTypeMapping:
                        type: object
                        description: 'Sets charts for grid, main or stat tables. See values of

                          transpose for object key and values of

                          `questionTableChartType` for value mapping.

                          '
                  multiSelectOneD:
                    type: object
                    description: 'Report defaults for multiselect (checkbox) one dimensional question.

                      '
                    properties:
                      customBase:
                        type: string
                        description: Sets the default % Base
                        enum:
                        - answering
                        - shown
                        - segment
                        - responses
                      expandable:
                        type: boolean
                        description: 'Sets the default choice for ''Nest Rows Under Nets''.

                          '
                      stats:
                        type: array
                        description: Sets default stats.
                        items:
                          type: string
                          enum:
                          - counts
                      transpose:
                        type: boolean
                        description: 'Sets defaults choice for transposing of question table.

                          '
                      questionTableChartType:
                        type: string
                        description: 'Sets defaults choice for chart type.

                          '
