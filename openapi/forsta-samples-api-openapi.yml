  responses:
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  status:
                    type: string
                    description: HTTP status Code
                    example: 404
                    enum:
                    - 404
                  message:
                    type: string
                    example: Not found
                    description: Status message
                    enum:
                    - Not found
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                description: Error code and message
                properties:
                  status:
                    type: string
                    description: HTTP status Code
                    enum:
                    - 500
                  message:
                    type: string
                    description: Status message
                    enum:
                    - Internal Server Error
    '422':
      description: Unprocessable entity
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                description: Error code and message
                properties:
                  status:
                    type: string
                    description: HTTP status Code
                    example: 422
                    enum:
                    - 422
                  message:
                    type: string
                    example: Unprocessable entity
                    description: Status message
                    enum:
                    - Unprocessable entity
                  errors:
                    type: array
                    example:
                    - attribute: name
                      message: Expected type "string", got "number"
                    description: List of error objects with `attribute` and `message` keys.
                    items:
                      type: object
                      properties:
                        attribute:
                          type: string
                        message:
                          type: string
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                description: Error code and message
                properties:
                  status:
                    type: string
                    description: HTTP status Code
                    enum:
                    - 401
                  message:
                    type: string
                    example: Unauthorized
                    description: Status message
                    enum:
                    - Unauthorized
