openapi: 3.2.0
info:
  title: Decipher Rest Warnings Summary API
  version: '1.0'
  description: The Decipher REST API allows comprehensive automation of your private or shared Decipher instance.
servers:
- url: https://{server}/api/v1
  description: Replace server with your instance domain.
  variables:
    server:
      default: selfserve.decipherinc.com
      description: Server domain
security:
- APIKey: []
tags:
- name: Warnings Summary
paths:
  /rh/warnings/summary:
    get:
      operationId: getRHWarningsSummary
      summary: Get warnings summary
      description: 'Retrieve summaries of project warnings for companies'' projects. Returns an array of objects for each project.

        Events are summarized as counts occurring during the period specified. Only events experienced by non-users (i.e., logged-out participants) in non-testing surveys are reported. Best efforts are made to eliminate duplicate events from the results.'
      tags:
      - Warnings Summary
      parameters:
      - name: companies
        description: 'restrict projects to just those owned by companies with these IDs

          '
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
      - name: state
        description: restrict projects to just those with this state
        in: query
        required: false
        schema:
          default: any
          type: string
          enum:
          - live
          - closed
          - any
      - name: start
        description: restrict warnings counts to include only those occurring on/after this date (in ISO 8601 format)
        in: query
        required: false
        schema:
          type: string
          format: YYYY-MM-DD
      - name: end
        description: restrict warnings counts to include only those occurring on/before this date
        in: query
        required: false
        schema:
          type: string
          format: YYYY-MM-DD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: project name
                    path:
                      type: string
                      description: project path
                    company:
                      type: integer
                      description: company id
                    lastEditBy:
                      type: string
                      description: the user who last edited this survey
                    blocks:
                      type: integer
                      description: 'occurences of participants being blocked from enter the survey

                        for various reasons

                        '
                    missing_resources:
                      type: integer
                      description: 'occurences of a nonexistent static resource (e.g. image or

                        script) being requested by the survey

                        '
                    exceptions:
                      type: integer
                      description: fatal errors experienced by participants
                    quota_misses:
                      type: integer
                      description: 'occurrences of a participant failing to qualify for a quota

                        table

                        '
components:
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: x-apikey
      description: 'In order to access the api, you''ll need to generate an API key. Refer to the

        instructions [here](/docs/decipher/api#section/API-Keys) to generate and

        configure an API key with the appropriate permission sets. You can generate

        as many keys as required.


        Configure each request to include your API key in the request header. For example:


        ```

        x-apikey: dp48ss3mgsaucyjtybxw728h7s4cgnwzhejtszdwhf4xpe8yhmtdwpk2ntdhtwbs

        ```

        '
