openapi: 3.2.0
info:
  title: Forsta Survey API
  version: ''
  description: 'Operations tagged Survey across 2 of this provider''s published API definitions: forsta-panel-management-community-openapi.yml, forsta-panel-management-integration-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{server}
  description: Replace server with your instance domain.
  variables:
    server:
      default: staging.panel.dev.focusvision.com/
      description: Server domain
tags:
- name: Survey
paths:
  /api.pro#method=portal.survey.completed:
    post:
      operationId: portal.survey.completed
      summary: This method returns a list of completed surveys
      tags:
      - Survey
      parameters:
      - $ref: '#/components/parameters/method'
        schema:
          enum:
          - portal.survey.completed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type:
                  - integer
                  - 'null'
                  description: Max number of surveys to return.
                  default: null
                offset:
                  type:
                  - integer
                  - 'null'
                  description: Offset the output for pagination.
                  default: null
                seskey:
                  type: string
                  description: A valid login hash.
              required:
              - seskey
            example:
              seskey: ce512c91
              limit: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error'
                - type: object
                  properties:
                    success:
                      type: boolean
                      description: The list of completed surveys was successful.
                    limit:
                      type:
                      - integer
                      - 'null'
                      description: The limit supplied in the call
                    offset:
                      type:
                      - integer
                      - 'null'
                      description: The offset supplied in the call
                    count:
                      type: integer
                      description: The total count of items available (regardless of limit and offset)
                    surveys:
                      type: array
                      description: Array of surveys the panelist has completed or been terminated from.
                      items:
                        properties:
                          subject:
                            type: string
                            description: Multilingual survey name from the campaign
                          body:
                            type: string
                            description: Multilingual survey description from the campaign
                          status:
                            type: string
                            enum:
                            - completed
                            - profile
                            - quota
                            description: Survey status, 'completed', 'profile' or 'quota'.
                          time:
                            type: string
                            description: The ISO 8601 time the survey was finished.
                          points:
                            type: integer
                            description: The number of points awarded for a completed survey/
                          projectid:
                            type: integer
                            description: The project ID.
                          categoryids:
                            type: array
                            description: Array of category IDs
              examples:
                success:
                  summary: Success
                  value:
                    success: true
                    limit: null
                    offset: null
                    count: 2
                    surveys:
                    - subject: Vacation survey
                      body: Take this survey to win a new iPad
                      status: completed
                      time: 2013-06-14 11:32
                      points: 200
                      projectid: 45
                    - subject: Foo bar survey
                      body: Take this survey to earn 200 reward points
                      status: quota
                      time: 2013-06-13 09:32
                      points: 200
                      projectid: 34
                error-0:
                  description: Session key is not in correct format.
                  summary: Session invalid
                  value:
                    success: false
                    error: Session string is invalid
                    errno: '20101'
                error-1:
                  description: Session is not valid or is not found for supplied session key.
                  summary: Session invalid
                  value:
                    success: false
                    error: Session invalid
                    errno: '30100'
                error-2:
                  description: Session has expired.
                  summary: Session expired
                  value:
                    success: false
                    error: Session expired
                    errno: '30100'
      security:
      - ApiKey: []
    servers:
    - url: https://{server}
      description: Replace server with your instance domain.
      variables:
        server:
          default: staging.panel.dev.focusvision.com/
          description: Server domain
  /api.pro#method=portal.survey.completedByCategory:
    post:
      operationId: portal.survey.completedByCategory
      summary: Returns a list of completed surveys - filtered by category id
      tags:
      - Survey
      parameters:
      - $ref: '#/components/parameters/method'
        schema:
          enum:
          - portal.survey.completedByCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type:
                  - integer
                  - 'null'
                  description: Max number of surveys to return.
                  default: null
                offset:
                  type:
                  - integer
                  - 'null'
                  description: Offset the output for pagination.
                  default: null
                categoryid:
                  type: integer
                  description: Category ID
                seskey:
                  type: string
                  description: A valid login hash.
              required:
              - seskey
              - categoryid
            example:
              seskey: ce512c91
              limit: 10
              offset: 20
              categoryid: 42
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error'
                - type: object
                  properties:
                    success:
                      type: boolean
                      description: The list of completed surveys was successful.
                    limit:
                      type:
                      - integer
                      - 'null'
                      description: The limit supplied in the call
                    offset:
                      type:
                      - integer
                      - 'null'
                      description: The offset supplied in the call
                    count:
                      type: string
                      description: The total count of items available (regardless of limit and offset)
                    surveys:
                      type: array
                      description: Array of surveys the panelist has completed or been terminated from.
                      items:
                        properties:
                          subject:
                            type: string
                            description: Multilingual survey name from the campaign
                          body:
                            type: string
                            description: Multilingual survey description from the campaign
                          status:
                            type: string
                            enum:
                            - completed
                            - profile
                            - quota
                            description: Survey status, 'completed', 'profile' or 'quota'.
                          time:
                            type: string
                            description: The ISO 8601 time the survey was finished.
                          points:
                            type: integer
                            description: The number of points awarded for a completed survey/
                          projectid:
                            type: integer
                            description: The project ID.
                          categoryids:
                            type: array
                            description: Array of category IDs
                            items:
                              type: integer
              examples:
                success:
                  summary: Success
                  value:
                    success: true
                    limit: null
                    offset: null
                    count: '2'
                    surveys:
                    - subject: Vacation survey
                      body: Take this survey to win a new iPad
                      status: completed
                      time: 2013-06-14 11:32
                      points: 200
                      projectid: 45
                      categoryids: []
                    - subject: Foo bar survey
                      body: Take this survey to earn 200 reward points
                      status: quota
                      time: 2013-06-13 09:32
                      points: 200
                      projectid: 34
                      categoryids:
                      - 1
                      - 2
                error-0:
                  description: Category ID is required and must be numeric.
                  summary: Category ID invalid
                  value:
                    success: false
                    error: Category ID missing or invalid
                    errno: '0'
                error-1:
                  description: Session key is not in correct format.
                  summary: Session invalid
                  value:
                    success: false
                    error: Session string is invalid
                    errno: '20101'
                error-2:
                  description: Session is not valid or is not found for supplied session key.
                  summary: Session invalid
                  value:
                    success: false
                    error: Session invalid
                    errno: '30100'
                error-3:
                  description: Session has expired.
                  summary: Session expired
                  value:
                    success: false
                    error: Session expired
                    errno: '30100'
      security:
      - ApiKey: []
    servers:
    - url: https://{server}
      description: Replace server with your instance domain.
      variables:
        server:
          default: staging.panel.dev.focusvision.com/
          description: Server domain
