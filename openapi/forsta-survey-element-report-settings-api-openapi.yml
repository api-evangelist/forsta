openapi: 3.2.0
info:
  title: Decipher Rest Survey Element Report Settings API
  version: '1.0'
  description: The Decipher REST API allows comprehensive automation of your private or shared Decipher instance.
servers:
- url: https://{server}/api/v1
  description: Replace server with your instance domain.
  variables:
    server:
      default: selfserve.decipherinc.com
      description: Server domain
security:
- APIKey: []
tags:
- name: Survey Element Report Settings
paths:
  /libraries/{company}/surveys/{survey}/report/{eid}:
    post:
      operationId: createLibrariesCompanySurveyReport
      summary: Save library report settings for a library element
      description: 'Save library report settings based on the company, project and library

        element id.'
      tags:
      - Survey Element Report Settings
      parameters:
      - name: company
        description: company ID or name
        in: path
        required: true
        schema:
          type: string
      - name: survey
        description: ''
        example: selfserve/123/140001
        in: path
        required: true
        schema:
          type: string
      - name: eid
        description: element id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                questionLabel:
                  description: ''
                  type: string
              required:
              - questionLabel
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: x-apikey
      description: 'In order to access the api, you''ll need to generate an API key. Refer to the

        instructions [here](/docs/decipher/api#section/API-Keys) to generate and

        configure an API key with the appropriate permission sets. You can generate

        as many keys as required.


        Configure each request to include your API key in the request header. For example:


        ```

        x-apikey: dp48ss3mgsaucyjtybxw728h7s4cgnwzhejtszdwhf4xpe8yhmtdwpk2ntdhtwbs

        ```

        '
