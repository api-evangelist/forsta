  /api.pro#method=portal.panelist.create:
    post:
      operationId: portal.panelist.create
      summary: Create a new panelist.
      description: <br><br><b>NOTE:</b><br>In most cases, <code>portal.email.sendOptInConfirmation</code> will need to be called after panelist is created successfully.
      tags:
        - Panelist
      parameters:
        - $ref: '#/components/parameters/method'
          schema:
            enum:
              - portal.panelist.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                panelid:
                  type: integer
                  description: The panelid in which the new panelist should be assigned.
                datapoints:
                  type: array
                  description: Array of data points and values to assign to the new panelist.
                  items:
                    required:
                      - label
                      - answer
                    properties:
                      label:
                        type: string
                        description: The datapoint label, may also be one of the reserved labels (email, password, identifier, sourceid, etc.). Email is the only required field.<br> Please note, that data point labels are <strong>case sensitive</strong>!
                      answer:
                        oneOf:
                          - type:
                              - string
                              - 'null'
                          - type:
                              - number
                              - 'null'
                        description: The panelist's data point or system field value. Checkboxes should be passed-in as a comma-separated list. Password can be plain text or a bcrypt hash.
                referral:
                  type:
                    - string
                    - 'null'
                  description: A referral hash, as returned by <code>portal.panelist.referralHash</code>, or NULL if this isn't a referral.
                points:
                  type: string
                  description: Initial number of points awarded for joining
              required:
                - panelid
                - datapoints
            example:
              panelid: 1
              datapoints:
                - label: email
                  answer: demo@example.com
                - label: password
                  answer: demopassword
                - label: QGENDER
                  answer: Female
              referral: 4a2642645e73235ee9daafb0b2df287b
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error'
                  - type: object
                    properties:
                      success:
                        type: boolean
