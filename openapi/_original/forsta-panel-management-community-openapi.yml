      summary: Gets the currently set panelist contact frequencies.
      description: <br><br><b>Notice:</b><br>Panelists don't have a contact frequencies record by default.
      tags:
        - Panelist
      parameters:
        - $ref: '#/components/parameters/method'
          schema:
            enum:
              - portal.panelist.contactFrequenciesGet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seskey:
                  type: string
