                panelistid:
                  type: integer
                  description: The id of the panelist that wishes to join.
                verification:
                  type: string
                  description: The verification hash returned by the <code>portal.panelist.create</code> function.
              required:
                - panelid
                - panelistid
                - verification
            example:
              panelid: 1
              panelistid: 15
              verification: c50dea019651460501d2b9dcc0a8aafa
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error'
                  - type: object
                    properties:
                      success:
                        type: boolean
                        description: Confirming the panelist was successful.
                      panelistid:
                        type: integer
                        description: The panelistid of the confirmed panelist.
                      seskey:
                        type: string
                        description: The sessionKey of the confirmed panelist.
                      fullname:
                        type: string
                        description: The full name of the confirmed panelist.
                      email:
                        type: string
                        description: The email address of the confirmed panelist.
                      firstname:
                        type: string
                        description: The first name of the panelist who has logged in.
                      lastname:
                        type: string
                        description: The last name of the panelist who has logged in.
              examples:
                success:
                  summary: Success
                  value:
                    success: true
                    panelistid: 15
                    seskey: ce512c91
