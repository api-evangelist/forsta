openapi: 3.2.0
info:
  title: Decipher Rest Survey Elements API
  version: '1.0'
  description: The Decipher REST API allows comprehensive automation of your private or shared Decipher instance.
servers:
- url: https://{server}/api/v1
  description: Replace server with your instance domain.
  variables:
    server:
      default: selfserve.decipherinc.com
      description: Server domain
security:
- APIKey: []
tags:
- name: Survey Elements
paths:
  /libraries/{company}/surveys/{survey}/elements:
    get:
      operationId: getLibrariesCompanySurveyElements
      summary: Get survey elements
      description: Retrieve the survey elements from a specified survey.
      tags:
      - Survey Elements
      parameters:
      - description: company ID or name
        in: path
        name: company
        required: true
        schema:
          type: string
      - description: survey to retrieve the links for.
        example: selfserve/123/140001
        in: path
        name: survey
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      description: the element type
                    xml:
                      type: string
                      format: xml
                      description: the element xml
                    children:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            description: the element type
                          xml:
                            type: string
                            format: xml
                            description: the element xml
              example:
              - children:
                - type: html
                  xml: <html label="q1">Hello</html>
                - type: suspend
                  xml: <suspend />
                type: block
                xml: "<block label=\"b1\">\n    <html id=\"ObIIe\" label=\"q1\">Hello</html>\n    <suspend id=\"Z396J\"/>\n  </block>\n"
components:
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: x-apikey
      description: 'In order to access the api, you''ll need to generate an API key. Refer to the

        instructions [here](/docs/decipher/api#section/API-Keys) to generate and

        configure an API key with the appropriate permission sets. You can generate

        as many keys as required.


        Configure each request to include your API key in the request header. For example:


        ```

        x-apikey: dp48ss3mgsaucyjtybxw728h7s4cgnwzhejtszdwhf4xpe8yhmtdwpk2ntdhtwbs

        ```

        '
