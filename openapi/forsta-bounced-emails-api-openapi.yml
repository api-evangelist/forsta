openapi: 3.2.0
info:
  title: Decipher Rest Bounced Emails API
  version: '1.0'
  description: The Decipher REST API allows comprehensive automation of your private or shared Decipher instance.
servers:
- url: https://{server}/api/v1
  description: Replace server with your instance domain.
  variables:
    server:
      default: selfserve.decipherinc.com
      description: Server domain
security:
- APIKey: []
tags:
- name: Bounced Emails
paths:
  /bulk/bounced:
    post:
      operationId: createBulkBounced
      summary: Check for known bounce-backs
      description: Send a list of emails to check for known bounce-backs. Staff access required.
      tags:
      - Bounced Emails
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                emails:
                  description: list of email addresses to check.
                  type: array
                  items:
                    type: string
                    format: email address
              required:
              - emails
              example:
                emails:
                - gooduser@example.com
                - baduser@example.com
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bounced:
                    type: array
                    description: list of details about each bounce
                    items:
                      type: object
                      properties:
                        reason:
                          type: string
                          description: the reason for the bounce
                        code:
                          type: string
                          description: the error code
                        email:
                          type: string
                          format: email
                          description: the email address that bounced
                        tstamp:
                          type: string
                          format: ISO 8601 timestamp with timezone
                          description: time of bounce
                  misses:
                    type: integer
                    description: count of misses
                  hits:
                    type: integer
                    description: count of hits
              example:
                bounced:
                - reason: Mailbox unavailable
                  code: 550
                  email: baduser@example.com
                  tstamp: '2020-05-02T19:19:27Z'
                misses: 1
                hits: 1
      x-codeSamples:
      - lang: beacon
        source: 'beacon post bulk/bounced emails="gooduser@example.com,baduser@example.com"

          '
      - lang: curl
        source: "curl --location \\\n  --request POST '{server}/api/v1/bulk/bounced' \\\n  --header 'x-apikey: {api_key}' \\\n  --header 'Content-Type: application/json' \\\n  --data-raw '{\n    \"emails\": [\"gooduser@example.com\", \"baduser@example.com\"]\n  }'\n"
components:
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: x-apikey
      description: 'In order to access the api, you''ll need to generate an API key. Refer to the

        instructions [here](/docs/decipher/api#section/API-Keys) to generate and

        configure an API key with the appropriate permission sets. You can generate

        as many keys as required.


        Configure each request to include your API key in the request header. For example:


        ```

        x-apikey: dp48ss3mgsaucyjtybxw728h7s4cgnwzhejtszdwhf4xpe8yhmtdwpk2ntdhtwbs

        ```

        '
