  /api.pro#method=integration.panelist.bulkupdate:
    post:
      operationId: panelistBulkUpdate
      summary: Update datapoints for multiple panelists
      description: 'Update datapoints for multiple panelists.


        Depending on the amount of panelist records that are being changed,

        this call can take a few minutes to complete. It will, however, immediately return a token

        that can be used to check the status of the process and verify whether there were any issues.'
      tags:
      - Panelist
      security:
      - ApiKey: []
      parameters:
      - $ref: '#/components/parameters/method'
        schema:
          enum:
          - integration.panelist.bulkupdate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - sesKey
              - settings
              properties:
                sesKey:
                  description: A valid login hash.
                  type: string
                  example: '[your sesKey]'
                settings:
                  type: array
                  description: An array of panelist records you wish to update.<br/> Each "row" represents a single panelist and must contain label/answer objects.<br/> The included labels must match for all panelists in the list.<br/> The panelist’s identifier or email address must always be included.
                  items:
                    type: array
                    items:
                      required:
                      - label
                      - answer
                      type: object
                      properties:
                        label:
                          type: string
                          description: A valid datapoint label or panelist field.
                        answer:
                          type: string
                          description: The answer to set for the label.
                  example:
                  - - label: identifier
                      answer: identifier_1
                    - label: Qfirstname
                      answer: Alida
                    - label: Qlastname
                      answer: Beaver
                    - label: Qhouseholdappliances
                      answer: 1,2,5
                    - label: Qgender
                      answer: 2
                  - - label: identifier
                      answer: identifier_2
                    - label: Qfirstname
                      answer: Neil
                    - label: Qlastname
                      answer: Toth
                    - label: Qhouseholdappliances
                      answer: 2,5,6
                    - label: Qgender
                      answer: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/error'
                - type: object
                  properties:
                    success:
                      type: boolean
                      description: '&nbsp;'
                    token:
                      type: string
                      description: A token which can be used with <code>integration.token.get</code> to check the status of the operation.
              examples:
                success-0:
                  summary: Success
                  value:
                    success: true
                    token: 5ix2h091vv8ckg4044sg00c0g
                error-0:
                  description: ''
                  summary: Label invalid, must be a string.
                  value:
                    success: false
                    error: Invalid label
                    errno: '0'
                error-1:
                  description: ''
                  summary: Label invalid, must exist.
                  value:
                    success: false
                    error: 'Unknown datapoint label: &lt;label&gt;'
                    errno: '0'
                error-2:
                  description: ''
                  summary: Data invalid, consult the manual.
                  value:
                    success: false
                    error: 'Invalid data structure (line: nnn)'
                    errno: '0'
                error-3:
                  description: ''
                  summary: Data invalid. "label" missing in the answer / label object.
                  value:
                    success: false
                    error: 'Invalid data structure: label not found (line: nnn)'
                    errno: '0'
                error-4:
                  description: ''
                  summary: Data invalid. "answer" missing in the answer / label object.
                  value:
                    success: false
                    error: 'Invalid data structure: answer not found (line: nnn)'
                    errno: '0'
                error-5:
                  description: ''
                  summary: Data invalid. Label / answer not there.
                  value:
                    success: false
                    error: 'Label / answer array expected (line: %u)'
                    errno: '0'
                error-6:
                  description: ''
                  summary: All panelist records must include the same "labels".
                  value:
                    success: false
                    error: 'Unexpected label found (line: nnn)'
                    errno: '0'
                error-7:
                  description: ''
                  summary: One or more choices for a checkbox datapoint are invalid.
                  value:
                    success: false
                    error: 'Invalid choice found (line: nnn)'
                    errno: '0'
    servers:
    - url: https://{server}
      description: Replace server with your instance domain.
      variables:
        server:
          default: staging.panel.dev.focusvision.com/
          description: Server domain
