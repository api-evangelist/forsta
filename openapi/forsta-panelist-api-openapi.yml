                items:
                  type: object
                  properties:
                    id:
                      type: string
                    status:
                      type: string
                    started_at:
                      type: integer
                    status_changed_at:
                      type: integer
                    panelist_id:
                      type: string
                    project_id:
                      type: string
                  example:
                  - id: string
                    status: pending
                    started_at: 0
                    status_changed_at: 0
                    panelist_id: string
                    project_id: string
        '400':
