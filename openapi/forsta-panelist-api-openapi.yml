      - $ref: '#/components/parameters/panelistidfilter'
      - in: query
        name: filter[status]
        required: false
        description: 'Filter by activity status.

          Valid values are:

          - pending

          - invited

          - started

          - profile

          - quota

          - completed


          To filter by multiple statuses, provide them as a comma separated list.'
        schema:
          type: string
        examples:
          Single status:
            value: filter[status]=completed
            description: Get only activities which resulted in a complete.
            summary: Single status
          Multiple statuses:
            value: filter[status]=started,profile,quota,completed
            description: Get only activities where panelists clicked the invite.
            summary: Multiple statuses
      - in: query
        name: filter[status_changed_at][gt]
        required: false
        description: 'Filter the `status_changed_at` timestamp by values greater than what you provided.


          Expected value is a Unix Timestamp.


          The `gt` filter value is not inclusive, i.e. it is not "greater than or equal".'
        schema:
          type: integer
        examples:
          Example 1:
            value: filter[status_changed_at][gt]=1619560879
            description: 'Get only activities which occurred after (but not including): `1619560879`.'
      - in: query
        name: filter[status_changed_at][lt]
        required: false
        description: 'Filter the `status_changed_at` timestamp by values less than what you provided.


          Expected value is a Unix Timestamp.


          The `lt` filter value is not inclusive, i.e. it is not "less than or equal".'
        schema:
          type: integer
        examples:
          Example 1:
            value: filter[status_changed_at][lt]=1619560879
            description: 'Get only activities which occurred before (but not including): `1619560879`.'
