    get:
      operationId: panelistActivityByPanelId
      summary: Retrieve Panelist Survey Activity
      description: Results are ordered to show most recently created survey activity first.
      tags:
      - Panelist
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/panelid'
