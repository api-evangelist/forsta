openapi: 3.2.0
info:
  title: Decipher Rest Saved Project Parameters API
  version: '1.0'
  description: The Decipher REST API allows comprehensive automation of your private or shared Decipher instance.
servers:
- url: https://{server}/api/v1
  description: Replace server with your instance domain.
  variables:
    server:
      default: selfserve.decipherinc.com
      description: Server domain
security:
- APIKey: []
tags:
- name: Saved Project Parameters
paths:
  /parameters/{survey}:
    get:
      operationId: getParametersSurvey
      summary: Get saved project parameters
      description: 'Returns an object of saved project parameters. Requires survey edit or data

        edit permission for the project.'
      tags:
      - Saved Project Parameters
      parameters:
      - $ref: '#/components/parameters/survey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  /parameters/validate/{survey}:
    get:
      operationId: getParametersValidateSurvey
      summary: Validate saved project parameters
      description: 'Validates saved project parameters and returns an array of errors.

        Requires survey edit or data edit permission for the project.'
      tags:
      - Saved Project Parameters
      parameters:
      - $ref: '#/components/parameters/survey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    label:
                      type: string
                    title:
                      type: string
                    error:
                      type: string
  /parameters/update/{survey}:
    put:
      operationId: updateParametersUpdateSurvey
      summary: Update saved project parameters
      description: 'Sends an object of selected project parameters. Requires survey edit or data

        edit permission for the project.'
      tags:
      - Saved Project Parameters
      parameters:
      - $ref: '#/components/parameters/survey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parameters:
                  description: project parameters
                  type: object
              required:
              - parameters
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
components:
  parameters:
    survey:
      name: survey
      in: path
      required: true
      description: The survey path.
      example: selfserve/1a/123456
      schema:
        type: string
        format: uri
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: x-apikey
      description: 'In order to access the api, you''ll need to generate an API key. Refer to the

        instructions [here](/docs/decipher/api#section/API-Keys) to generate and

        configure an API key with the appropriate permission sets. You can generate

        as many keys as required.


        Configure each request to include your API key in the request header. For example:


        ```

        x-apikey: dp48ss3mgsaucyjtybxw728h7s4cgnwzhejtszdwhf4xpe8yhmtdwpk2ntdhtwbs

        ```

        '
