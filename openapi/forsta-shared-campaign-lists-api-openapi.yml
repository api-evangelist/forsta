openapi: 3.2.0
info:
  title: Decipher Rest Shared Campaign Lists API
  version: '1.0'
  description: The Decipher REST API allows comprehensive automation of your private or shared Decipher instance.
servers:
- url: https://{server}/api/v1
  description: Replace server with your instance domain.
  variables:
    server:
      default: selfserve.decipherinc.com
      description: Server domain
security:
- APIKey: []
tags:
- name: Shared Campaign Lists
paths:
  /surveys/{survey}/campaigns/shared:
    post:
      operationId: createSurveyCampaignShared
      summary: Create shared list
      description: 'Upload a recipient list which will be available for campaigns in this

        survey. The recipient list is created, encrypted and immediately marked

        as "shared". Using Campaign Manager the recipient list can be assigned

        to a campaign that doesn''t already have a recipient list.'
      tags:
      - Shared Campaign Lists
      parameters:
      - name: survey
        description: 'path to survey. Requires Campaign Manager: Build permission.'
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  description: 'either an array of JSON objects, a tab-delimited string with the

                    data (UTF-8) or a base-64 encoded Excel 97 or 2007 file with data

                    in the first sheet only

                    '
                  type: string
                name:
                  description: 'Shared recipient list description which will be visible in

                    Campaign Manager

                    '
                  type: string
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  basename:
                    type: string
                  filename:
                    type: string
components:
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: x-apikey
      description: 'In order to access the api, you''ll need to generate an API key. Refer to the

        instructions [here](/docs/decipher/api#section/API-Keys) to generate and

        configure an API key with the appropriate permission sets. You can generate

        as many keys as required.


        Configure each request to include your API key in the request header. For example:


        ```

        x-apikey: dp48ss3mgsaucyjtybxw728h7s4cgnwzhejtszdwhf4xpe8yhmtdwpk2ntdhtwbs

        ```

        '
