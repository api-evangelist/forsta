openapi: 3.2.0
info:
  title: Decipher Rest Logic Events API
  version: '1.0'
  description: The Decipher REST API allows comprehensive automation of your private or shared Decipher instance.
servers:
- url: https://{server}/api/v1
  description: Replace server with your instance domain.
  variables:
    server:
      default: selfserve.decipherinc.com
      description: Server domain
security:
- APIKey: []
tags:
- name: Logic Events
paths:
  /schedule:
    get:
      operationId: getSchedule
      summary: Get logic events
      description: 'Retrieve an array of events scheduled for any survey that you are able to

        access. Those events can only be created by logic nodes.'
      tags:
      - Logic Events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    retries:
                      type: integer
                      description: 'number of times execution of this event has been retried due

                        to some API error

                        '
                    completed:
                      type: boolean
                      description: 'true if that item has been completed, false if it was

                        scheduled

                        '
                    tstamp:
                      type: string
                      format: ISO 8601 timestamp with timezone
                      description: 'the timestamp of next attempted execution of the event

                        '
                    element_type:
                      type: string
                      description: the logic node type responsible
                    element:
                      type: string
                      description: the label of the element responsible
                    originally_scheduled:
                      type: string
                      format: ISO 8601 timestamp with timezone
                      description: 'the time the event was originally scheduled for. This remains

                        fixed, while `tstamp` can update as the event is retried

                        '
                    scheduling:
                      type: string
                      description: 'English description of how this event is being scheduled

                        '
                    path:
                      type: string
                      description: path to the survey
                    id:
                      type: string
                      description: internal event ID
                    element_title:
                      type: string
                      description: 'English description of the action provided by the element

                        '
components:
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: x-apikey
      description: 'In order to access the api, you''ll need to generate an API key. Refer to the

        instructions [here](/docs/decipher/api#section/API-Keys) to generate and

        configure an API key with the appropriate permission sets. You can generate

        as many keys as required.


        Configure each request to include your API key in the request header. For example:


        ```

        x-apikey: dp48ss3mgsaucyjtybxw728h7s4cgnwzhejtszdwhf4xpe8yhmtdwpk2ntdhtwbs

        ```

        '
