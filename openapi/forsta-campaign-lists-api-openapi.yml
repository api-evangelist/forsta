openapi: 3.2.0
info:
  title: Decipher Rest Campaign Lists API
  version: '1.0'
  description: The Decipher REST API allows comprehensive automation of your private or shared Decipher instance.
servers:
- url: https://{server}/api/v1
  description: Replace server with your instance domain.
  variables:
    server:
      default: selfserve.decipherinc.com
      description: Server domain
security:
- APIKey: []
tags:
- name: Campaign Lists
paths:
  /surveys/{survey}/campaigns/{campaign}/list:
    get:
      operationId: getSurveyCampaignList
      summary: Get list
      description: 'Retrieve a list or seed list for a specific campaign along with details

        for each entry in the list.


        The response will be a tab-delimited file with email, source, decSent,

        status, and extra columns. decSent will be a 1 or 0 depending on if an email

        has been sent to that recipient. The extra column will provide additional

        details on optouts and suppressions, such as which list resulted in that

        status.'
      tags:
      - Campaign Lists
      parameters:
      - $ref: '#/components/parameters/survey'
      - name: campaign
        description: 'The numeric campaign ID. The ID can be seen when editing the campaign or

          retrieved using the get campaigns method.

          '
        in: path
        required: true
        schema:
          type: integer
      - name: seed
        description: 'Pass true if you would like to retreive the seed list, or omit this

          parameter to retrieve the standard list.

          '
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            text/tab-separated-values:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    email:
                      description: The email address of the recipient
                      type: string
                    source:
                      description: The unique source value for this list entry
                      type: string
                    decSent:
                      description: 1 if email has been sent to this source, 0 otherwise
                      type: integer
                    status:
                      description: The send status for this entry
                      type: string
                    extra:
                      description: Additional information about this status
                      type: string
              example: "email\tsource\tdecSent\tstatus\textra\nfoo@example.com\t123456\t1\tok\t\nbar@example.com\t234567\t1\toptout\tselfserve/53a/remove\n"
    put:
      operationId: updateSurveyCampaignList
      summary: Create/replace list
      description: 'Create a recipient list or seed list for this campaign. If the campaign has

        an existing list, the list will be replaced.'
      tags:
      - Campaign Lists
      parameters:
      - $ref: '#/components/parameters/survey'
      - name: campaign
        description: 'numeric campaign ID. The ID can be seen when editing the campaign or

          retrieved using the GET method above.

          '
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  description: 'either an array of JSON objects, a tab-delimited string with the

                    data (UTF-8) or a base-64 encoded Excel 97 or 2007 file with data

                    in the first sheet only

                    '
                  type: string
                seed:
                  description: 'if the file being created or replaced should be a seed list.

                    '
                  type: boolean
                  default: false
              required:
              - data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
components:
  parameters:
    survey:
      name: survey
      in: path
      required: true
      description: The survey path.
      example: selfserve/1a/123456
      schema:
        type: string
        format: uri
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: x-apikey
      description: 'In order to access the api, you''ll need to generate an API key. Refer to the

        instructions [here](/docs/decipher/api#section/API-Keys) to generate and

        configure an API key with the appropriate permission sets. You can generate

        as many keys as required.


        Configure each request to include your API key in the request header. For example:


        ```

        x-apikey: dp48ss3mgsaucyjtybxw728h7s4cgnwzhejtszdwhf4xpe8yhmtdwpk2ntdhtwbs

        ```

        '
