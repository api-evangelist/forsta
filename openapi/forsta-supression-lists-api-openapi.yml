openapi: 3.2.0
info:
  title: Decipher Rest Supression Lists API
  version: '1.0'
  description: The Decipher REST API allows comprehensive automation of your private or shared Decipher instance.
servers:
- url: https://{server}/api/v1
  description: Replace server with your instance domain.
  variables:
    server:
      default: selfserve.decipherinc.com
      description: Server domain
security:
- APIKey: []
tags:
- name: Supression Lists
paths:
  /surveys/{survey}/campaigns/suppressions:
    get:
      operationId: getSurveyCampaignsSupressions
      summary: Get suppression lists
      description: Returns a list of available suppression lists for the specific project.
      tags:
      - Supression Lists
      parameters:
      - $ref: '#/components/parameters/survey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    count:
                      type: integer
                    date:
                      type: string
                      format: ISO 8601 timestamp with timezone
                    suppression_id:
                      type: string
              example:
              - count: 3
                date: '2020-05-01T18:03:50Z'
                suppression_id: 7ZO4Xg
              - count: 10
                date: '2020-05-05T18:04:38Z'
                suppression_id: wmAevJ
    put:
      operationId: updateSurveyCampaignsSupression
      summary: Create suppression list
      description: Creates a list of emails to be suppressed when scheduling an email send.
      tags:
      - Supression Lists
      parameters:
      - $ref: '#/components/parameters/survey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                emails:
                  description: array of emails to be suppressed
                  type: array
                  items:
                    type: string
                    format: email address
              required:
              - emails
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invalid:
                    type: array
                    items:
                      type: string
                  invalid_count:
                    type: integer
                  suppression_id:
                    type: string
                  total:
                    type: integer
                  valid_count:
                    type: integer
              example:
                invalid:
                - john@smith@example.com
                invalid_count: 1
                suppression_id: 7ZO4Xg
                total: 4
                valid_count: 3
  /surveys/{survey}/campaigns/suppressions/{suppression}:
    get:
      operationId: getSurveyCampaignsSupression
      summary: Get suppression list
      description: Returns the emails of a suppression list.
      tags:
      - Supression Lists
      parameters:
      - $ref: '#/components/parameters/survey'
      - name: suppression
        description: suppression id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: email address
              example:
              - larry@example.com
              - curly@example.com
              - moe@example.com
components:
  parameters:
    survey:
      name: survey
      in: path
      required: true
      description: The survey path.
      example: selfserve/1a/123456
      schema:
        type: string
        format: uri
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: x-apikey
      description: 'In order to access the api, you''ll need to generate an API key. Refer to the

        instructions [here](/docs/decipher/api#section/API-Keys) to generate and

        configure an API key with the appropriate permission sets. You can generate

        as many keys as required.


        Configure each request to include your API key in the request header. For example:


        ```

        x-apikey: dp48ss3mgsaucyjtybxw728h7s4cgnwzhejtszdwhf4xpe8yhmtdwpk2ntdhtwbs

        ```

        '
