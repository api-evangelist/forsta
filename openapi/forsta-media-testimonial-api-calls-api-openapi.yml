openapi: 3.2.0
info:
  title: Decipher Rest Media Testimonial API Calls API
  version: '1.0'
  description: The Decipher REST API allows comprehensive automation of your private or shared Decipher instance.
servers:
- url: https://{server}/api/v1
  description: Replace server with your instance domain.
  variables:
    server:
      default: selfserve.decipherinc.com
      description: Server domain
security:
- APIKey: []
tags:
- name: Media Testimonial API Calls
  description: 'Download media files collected via `mediatestimonial` questions.

    The download process is asynchronous: start a job, poll `/status?id={ident}`

    until complete, then retrieve the ZIP file via `/status/content?id={ident}`.'
paths:
  /surveys/{survey}/reports/media:
    post:
      operationId: createSurveyReportsMedia
      summary: Start media download
      description: 'Starts an async process to download all media files for a given `mediatestimonial`

        question. Optional segmentation and filtering can be applied via a crosstabs

        configuration identifier (`dlident`).


        Poll the status of the download using

        `GET /status?id={ident}`.

        Once the status is `done`, retrieve the file using `/status/content?id={ident}`.


        **Required permission:** `report.view`'
      tags:
      - Media Testimonial API Calls
      parameters:
      - $ref: '#/components/parameters/survey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - label
              properties:
                label:
                  type: string
                  description: The question label of the `mediatestimonial` question to download media for.
                dlident:
                  type: string
                  description: 'Optional crosstabs configuration identifier used to apply segmentation

                    or filtering to the download. If omitted, all records are included.

                    '
                fav:
                  type: boolean
                  default: false
                  description: When `true`, only media files marked as favorites are downloaded.
      responses:
        '200':
          description: OK — async download job started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ident:
                    type: string
                    description: Unique identifier for tracking the download progress. Pass this to the `status?id=<ident>` endpoint.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
components:
  parameters:
    survey:
      name: survey
      in: path
      required: true
      description: The survey path.
      example: selfserve/1a/123456
      schema:
        type: string
        format: uri
  schemas:
    error:
      type: object
      properties:
        $code:
          description: The error code.
          type: integer
        $error:
          description: The error message.
          type: string
        extra:
          description: Additional error information.
          type: object
          additionalProperties: true
  responses:
    '403':
      description: API key is valid but access to requested resource is forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            $code: 403
            $error: API key is valid but access to requested resource is forbidden.
    '400':
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            $code: 400
            $error: The request is invalid.
    '401':
      description: The request is unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            $code: 401
            $error: The request is unauthorized.
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: x-apikey
      description: 'In order to access the api, you''ll need to generate an API key. Refer to the

        instructions [here](/docs/decipher/api#section/API-Keys) to generate and

        configure an API key with the appropriate permission sets. You can generate

        as many keys as required.


        Configure each request to include your API key in the request header. For example:


        ```

        x-apikey: dp48ss3mgsaucyjtybxw728h7s4cgnwzhejtszdwhf4xpe8yhmtdwpk2ntdhtwbs

        ```

        '
